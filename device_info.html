<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>QC Portal - Thông Tin Thiết Bị</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Cấu hình PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#312e81">
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Script Kiểm tra & Tự động Update bản mới (PWA) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(reg => {
            // Ép trình duyệt kiểm tra bản cập nhật
            reg.update();
            
            // Nếu có bản mới -> Tự động kích hoạt và reload
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              installingWorker.onstatechange = () => {
                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('Có phiên bản code mới! Đang tự động tải lại...');
                  window.location.reload();
                }
              };
            };
          }).catch(err => console.log('Lỗi Service Worker:', err));
        });
      }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen w-full flex flex-col md:flex-row overflow-hidden">

    <!-- ================= SIDEBAR MENU ================= -->
    <aside class="w-full md:w-64 bg-indigo-900 text-white flex flex-col flex-shrink-0 shadow-xl z-20 transition-all">
        <div class="h-auto md:h-[72px] flex items-center justify-between px-6 py-4 md:py-0 border-b border-indigo-800 bg-[#28256b]">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-square-poll-vertical text-indigo-400 text-[28px]"></i>
                <div>
                    <h1 class="text-xl font-bold leading-tight">QC Portal</h1>
                    <p class="text-indigo-300 text-[11px] font-medium tracking-wide">Report & Device Tool</p>
                </div>
            </div>
        </div>
        
        <nav class="flex md:flex-col gap-2 p-4 overflow-x-auto md:overflow-y-auto flex-1 bg-indigo-800 md:bg-transparent custom-scrollbar">
            <a href="index" class="whitespace-nowrap flex items-center gap-3 px-4 py-3.5 text-sm font-bold rounded-xl transition text-indigo-200 hover:bg-white/10 hover:text-white">
                <i class="fa-solid fa-chart-line w-5 text-center text-lg"></i> 
                <span>Báo Cáo Daily</span>
            </a>
            <a href="device_manage" class="whitespace-nowrap flex items-center gap-3 px-4 py-3.5 text-sm font-bold rounded-xl transition text-indigo-200 hover:bg-white/10 hover:text-white">
                <i class="fa-solid fa-mobile-screen-button w-5 text-center text-lg"></i> 
                <span>Mượn Device</span>
            </a>
            <a href="device_info" class="whitespace-nowrap flex items-center gap-3 px-4 py-3.5 text-sm font-bold rounded-xl transition bg-indigo-600 text-white shadow-md">
                <i class="fa-solid fa-circle-info w-5 text-center text-lg"></i> 
                <span>Thông tin Device</span>
            </a>
        </nav>
    </aside>

    <!-- ================= MAIN CONTENT ================= -->
    <div class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50 relative">
        
        <!-- HEADER -->
        <header class="bg-white text-slate-800 shadow-sm border-b border-slate-200 z-10 p-3 px-4 md:px-6 flex justify-between items-center min-h-[72px]">
            <div>
                <h2 class="text-xl font-bold text-slate-800 hidden sm:block">Danh Sách Thiết Bị</h2>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="bg-indigo-50 text-indigo-700 border border-indigo-200 px-4 py-2 rounded-xl text-sm font-bold shadow-sm">
                    Tổng: <span id="totalDeviceBadge" class="text-indigo-600 text-base ml-1">0</span> máy
                </div>
            </div>
        </header>

        <!-- MAIN SCROLLABLE CONTENT -->
        <main class="flex-1 overflow-y-auto p-4 md:p-6 relative">
            <div class="w-full mx-auto 2xl:max-w-[1600px] space-y-6">
                
                <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden w-full">
                    <!-- Thanh công cụ -->
                    <div class="p-5 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-50/80">
                        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-mobile-screen text-indigo-600"></i>
                            Cấu hình & Hiệu năng
                        </h3>
                        
                        <div class="flex items-center gap-3 w-full sm:w-auto">
                            <div class="relative w-full sm:w-72">
                                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                                <input type="text" id="searchInput" oninput="searchDevices()" placeholder="Tìm tên máy, OS, hiệu năng..." class="w-full h-10 bg-white border border-slate-300 text-slate-700 font-medium text-xs rounded-xl pl-9 pr-4 focus:ring-2 focus:ring-indigo-500 outline-none shadow-sm transition">
                            </div>
                            
                            <!-- Nút Thêm Mới -->
                            <button onclick="openDeviceModal()" class="whitespace-nowrap h-10 px-4 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-sm transition flex items-center gap-2">
                                <i class="fa-solid fa-plus"></i> Thêm mới
                            </button>
                        </div>
                    </div>

                    <!-- Bảng Dữ Liệu -->
                    <div class="overflow-x-auto min-h-[500px]">
                        <table class="w-full text-sm text-left text-slate-600">
                            <thead class="text-slate-700 uppercase bg-slate-100 sticky top-0 border-b border-slate-200 text-xs font-bold">
                                <tr>
                                    <th class="px-5 py-4 w-16 text-center">STT</th>
                                    <th class="px-5 py-4">Tên Thiết Bị</th>
                                    <th class="px-5 py-4 w-32">Nền Tảng</th>
                                    <th class="px-5 py-4 w-40">Phiên Bản OS</th>
                                    <th class="px-5 py-4 w-32">Hiệu Năng</th>
                                    <th class="px-5 py-4 w-28 text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="deviceTableBody" class="divide-y divide-slate-200 font-medium">
                                <tr>
                                    <td colspan="6" class="text-center py-10 text-slate-400 italic">Đang tải dữ liệu từ Firebase...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <!-- ================= MODAL THÊM/SỬA THIẾT BỊ ================= -->
    <div id="deviceModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm px-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col transform transition-all">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 id="deviceModalTitle" class="text-lg font-bold text-indigo-900 flex items-center gap-2">
                    <i class="fa-solid fa-mobile-button text-indigo-600"></i> Thêm Mới Thiết Bị
                </h3>
                <button onclick="closeDeviceModal()" class="text-slate-400 hover:text-rose-500 transition outline-none">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <!-- Modal Body -->
            <div class="p-6 space-y-4">
                <input type="hidden" id="modalDeviceId">
                
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Tên Thiết Bị <span class="text-red-500">*</span></label>
                    <input type="text" id="modalDeviceName" placeholder="VD: iPhone 14 Pro Max" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">Nền Tảng</label>
                        <select id="modalDeviceType" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none bg-white cursor-pointer">
                            <option value="iOS">iOS</option>
                            <option value="Android">Android</option>
                            <option value="PC">PC</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">Hiệu Năng</label>
                        <select id="modalDevicePerf" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none bg-white cursor-pointer">
                            <option value="Mạnh">Mạnh</option>
                            <option value="Trung">Trung bình</option>
                            <option value="Yếu">Yếu</option>
                            <option value="Chưa phân loại">Chưa phân loại</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Phiên Bản OS <span class="text-slate-400 font-normal">(Tùy chọn)</span></label>
                    <input type="text" id="modalDeviceOS" placeholder="VD: iOS 16.4.1" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition">
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                <button onclick="closeDeviceModal()" class="px-5 py-2.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-bold rounded-xl transition shadow-sm">Hủy Bỏ</button>
                <button id="btnSaveDevice" onclick="saveDevice()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Lưu Thông Tin
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Alert -->
    <div id="customAlertModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden p-8 text-center space-y-4">
            <div id="customAlertIcon" class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-4xl shadow-inner">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800" id="customAlertTitle">Thành công!</h3>
            <p class="text-sm text-slate-600 font-medium" id="customAlertMessage">Đã thực hiện xong thao tác.</p>
            <button onclick="document.getElementById('customAlertModal').classList.add('hidden')" class="w-full px-4 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-sm transition mt-2">OK</button>
        </div>
    </div>

    <script>
        // === CẤU HÌNH FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyBZ72fOBO-VPMDrXBS4E15TN5L7tfcL46s",
            authDomain: "device-manage-d4f5d.firebaseapp.com",
            projectId: "device-manage-d4f5d",
            storageBucket: "device-manage-d4f5d.firebasestorage.app",
            messagingSenderId: "747189096859",
            appId: "1:747189096859:web:abcdef..."
        };

        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch (e) {
            console.error("Lỗi khởi tạo Firebase:", e);
        }

        let allDevicesList = [];

        // Lấy dữ liệu Real-time từ Firebase
        if (db) {
            db.collection("devices").orderBy("name").onSnapshot((snapshot) => {
                allDevicesList = [];
                snapshot.forEach((doc) => {
                    allDevicesList.push({ id: doc.id, ...doc.data() });
                });
                renderTable(allDevicesList);
            }, (error) => {
                console.error("Lỗi lấy data:", error);
            });
        }

        // ================= HÀM RENDER UI =================
        function renderTable(data) {
            const tbody = document.getElementById("deviceTableBody");
            document.getElementById("totalDeviceBadge").innerText = data.length;
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-10 text-slate-400 italic">Không tìm thấy thiết bị nào!</td></tr>';
                return;
            }

            data.forEach((device, index) => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-indigo-50/40 transition border-b border-slate-100";

                const name = device.name || "Chưa có tên";
                const type = device.type || "Khác";
                const osVersion = device.osVersion || "N/A";
                const perf = device.performance || "Chưa rõ";

                // CSS Nền tảng
                let typeBadge = `<span class="bg-slate-100 text-slate-600 px-2.5 py-1 rounded text-xs font-bold border border-slate-200">${type}</span>`;
                if (type.toLowerCase() === "ios") typeBadge = `<span class="bg-blue-50 text-blue-700 px-2.5 py-1 rounded text-xs font-bold border border-blue-200"><i class="fa-brands fa-apple mr-1"></i>${type}</span>`;
                if (type.toLowerCase() === "android") typeBadge = `<span class="bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded text-xs font-bold border border-emerald-200"><i class="fa-brands fa-android mr-1"></i>${type}</span>`;

                // CSS Hiệu năng
                let perfBadge = `<span class="text-slate-500 font-semibold">${perf}</span>`;
                if (perf.toLowerCase() === "mạnh") perfBadge = `<span class="text-emerald-600 font-black"><i class="fa-solid fa-bolt mr-1"></i>Mạnh</span>`;
                if (perf.toLowerCase().includes("trung")) perfBadge = `<span class="text-amber-500 font-black"><i class="fa-solid fa-battery-half mr-1"></i>Trung</span>`;
                if (perf.toLowerCase() === "yếu") perfBadge = `<span class="text-rose-500 font-black"><i class="fa-solid fa-battery-quarter mr-1"></i>Yếu</span>`;

                // Nén object device thành chuỗi an toàn
                const deviceStr = encodeURIComponent(JSON.stringify(device));

                tr.innerHTML = `
                    <td class="px-5 py-4 text-center font-mono text-slate-400">${index + 1}</td>
                    <td class="px-5 py-4 font-bold text-indigo-900">${name}</td>
                    <td class="px-5 py-4 whitespace-nowrap">${typeBadge}</td>
                    <td class="px-5 py-4 font-mono text-slate-700 font-semibold text-xs">${osVersion}</td>
                    <td class="px-5 py-4 whitespace-nowrap">${perfBadge}</td>
                    <td class="px-5 py-4 text-center whitespace-nowrap">
                        <button onclick="openDeviceModal('${deviceStr}')" class="text-indigo-500 hover:text-indigo-700 bg-indigo-50 hover:bg-indigo-100 p-2 rounded-lg transition mr-1.5" title="Sửa">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteDevice('${device.id}', '${name.replace(/'/g, "\\'")}')" class="text-rose-500 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 p-2 rounded-lg transition" title="Xóa">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function searchDevices() {
            const keyword = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allDevicesList.filter(d => 
                (d.name && d.name.toLowerCase().includes(keyword)) ||
                (d.type && d.type.toLowerCase().includes(keyword)) ||
                (d.osVersion && d.osVersion.toLowerCase().includes(keyword)) ||
                (d.performance && d.performance.toLowerCase().includes(keyword))
            );
            renderTable(filtered);
        }

        // ================= HÀM MODAL THÊM/SỬA =================
        function openDeviceModal(deviceStr = null) {
            const modal = document.getElementById('deviceModal');
            const title = document.getElementById('deviceModalTitle');
            const idInput = document.getElementById('modalDeviceId');
            const nameInput = document.getElementById('modalDeviceName');
            const typeInput = document.getElementById('modalDeviceType');
            const osInput = document.getElementById('modalDeviceOS');
            const perfInput = document.getElementById('modalDevicePerf');

            if (deviceStr) {
                // CHẾ ĐỘ SỬA
                const device = JSON.parse(decodeURIComponent(deviceStr));
                title.innerHTML = '<i class="fa-solid fa-pen text-indigo-600"></i> Chỉnh Sửa Thiết Bị';
                idInput.value = device.id;
                nameInput.value = device.name;
                typeInput.value = device.type || "Khác";
                osInput.value = device.osVersion || "";
                
                let p = device.performance;
                if (p === 'Trung') p = 'Trung bình';
                perfInput.value = p || "Chưa phân loại";
            } else {
                // CHẾ ĐỘ THÊM MỚI
                title.innerHTML = '<i class="fa-solid fa-mobile-button text-indigo-600"></i> Thêm Mới Thiết Bị';
                idInput.value = "";
                nameInput.value = "";
                typeInput.value = "iOS";
                osInput.value = "";
                perfInput.value = "Mạnh";
            }

            modal.classList.remove('hidden');
        }

        function closeDeviceModal() {
            document.getElementById('deviceModal').classList.add('hidden');
        }

        function saveDevice() {
            const id = document.getElementById('modalDeviceId').value;
            const name = document.getElementById('modalDeviceName').value.trim();
            const type = document.getElementById('modalDeviceType').value;
            const os = document.getElementById('modalDeviceOS').value.trim();
            let perf = document.getElementById('modalDevicePerf').value;

            if (perf === 'Trung bình') perf = 'Trung';

            if (!name) {
                showAlert('Lỗi', 'Vui lòng nhập Tên thiết bị!', true);
                return;
            }

            const btn = document.getElementById('btnSaveDevice');
            const origHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang lưu...`;

            const deviceData = {
                name: name,
                type: type,
                osVersion: os,
                performance: perf
            };

            if (id) {
                db.collection("devices").doc(id).update(deviceData)
                .then(() => {
                    closeDeviceModal();
                    showAlert('Thành công', `Đã cập nhật: ${name}`);
                })
                .catch(err => {
                    console.error(err);
                    showAlert('Lỗi', 'Không thể cập nhật thiết bị!', true);
                })
                .finally(() => { btn.disabled = false; btn.innerHTML = origHTML; });
            } else {
                db.collection("devices").add(deviceData)
                .then(() => {
                    closeDeviceModal();
                    showAlert('Thành công', `Đã thêm mới: ${name}`);
                })
                .catch(err => {
                    console.error(err);
                    showAlert('Lỗi', 'Không thể thêm thiết bị mới!', true);
                })
                .finally(() => { btn.disabled = false; btn.innerHTML = origHTML; });
            }
        }

        // ================= HÀM XÓA =================
        function deleteDevice(id, name) {
            if (confirm(`⚠️ Bạn có chắc chắn muốn xóa thiết bị [${name}] không?\nHành động này không thể hoàn tác.`)) {
                db.collection("devices").doc(id).delete()
                .then(() => {
                    showAlert('Đã Xóa', `Thiết bị [${name}] đã được xóa khỏi hệ thống.`);
                })
                .catch(err => {
                    console.error("Lỗi xóa:", err);
                    showAlert('Lỗi', 'Không thể xóa thiết bị này!', true);
                });
            }
        }

        // ================= ALERT POPUP =================
        function showAlert(title, message, isError = false) {
            const modal = document.getElementById('customAlertModal');
            document.getElementById('customAlertTitle').innerText = title;
            document.getElementById('customAlertMessage').innerText = message;
            const iconContainer = document.getElementById('customAlertIcon');

            if (isError) {
                iconContainer.className = "w-20 h-20 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto text-4xl shadow-inner";
                iconContainer.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else {
                iconContainer.className = "w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-4xl shadow-inner";
                iconContainer.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            }
            modal.classList.remove('hidden');
        }
    </script>
</body>
</html>
