name: Daily Device Report

on:
  schedule:
    # Chạy lúc 11:17 UTC (tương đương 18:17 giờ Việt Nam) mỗi ngày
    # Việc dùng số lẻ "17" giúp né được hàng đợi tắc nghẽn ở phút thứ 00 và 30 của GitHub
    - cron: '17 11 * * *'
  
  # Thêm dòng này để bạn có thể tự bấm nút "Run workflow" chạy bằng tay bất cứ lúc nào muốn test
  workflow_dispatch: 

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Daily Report Script
        # Sửa lại tên file 'runDailyReport.js' cho đúng với tên file script của bạn nếu cần
        run: node daily-report.js
